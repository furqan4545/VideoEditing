    <div id="talk-cap-ja" class="cap clip" data-start="{S_ja}" data-duration="{D_ja}"><div><p class="cjk">こんにちは。<br />今は日本語を話しています。</p><em>Hello. Now I'm speaking Japanese.</em></div></div>
    <div id="talk-cap-fr" class="cap clip" data-start="{S_fr}" data-duration="{D_fr}"><div><p>Bonjour. Maintenant, je parle français. Évidemment.</p><em>Hello. Now I speak French. Obviously.</em></div></div>
    <div id="talk-cap-zh" class="cap clip" data-start="{S_zh}" data-duration="{D_zh}"><div><p class="cjk">大家好。现在我说中文。</p><em>Hi everyone. Now I speak Chinese.</em></div></div>
    <div id="talk-cap-punch" class="cap clip" data-start="{S_punch}" data-duration="{D_punch}"><div><p>Jensen Huang loves<br />Chinese fine shyt.</p></div></div>
  </div>

  <script>
    (function () {
      const M = __MOUTH__;
      const LINES = __LINES__;
      const TOTAL = __TOTAL__;
      const REF = __REF__; // line timing the hand keys below were written against
      // rt(): a time on REF's clock -> the same moment on LINES' clock (inside a line: proportional;
      // in a gap: kept at the same distance from the nearer line edge)
      function rt(t) {
        const n = REF.length;
        if (t <= REF[0].start) return LINES[0].start - (REF[0].start - t);
        for (let k = 0; k < n; k++) {
          const a = REF[k], b = LINES[k];
          if (t <= a.end) return b.start + ((t - a.start) * (b.end - b.start)) / (a.end - a.start);
          if (k + 1 < n && t < REF[k + 1].start) {
            const after = t - a.end, before = REF[k + 1].start - t;
            return after <= before ? b.end + after : LINES[k + 1].start - before;
          }
        }
        return LINES[n - 1].end + (t - REF[n - 1].end);
      }
      const FPS = M.fps;
      const $ = (id) => document.getElementById(id);
      const set = (id, a, v) => $(id).setAttribute(a, v);

      // seeded blinks: fixed times plus one blink right after every language switch
      const BLINKS = [1.55, 2.9, 5.2, 6.6, 9.1, 12.2, 13.4, 15.6, 18.3, 19.4].map(rt).concat(LINES.slice(1).map((l) => l.start - 0.12));
      const blinkAt = (t) => {
        let v = 0;
        for (const b of BLINKS) {
          const d = Math.abs(t - b);
          if (d < 0.09) v = Math.max(v, 1 - d / 0.09);
        }
        return v;
      };
      const sample = (arr, t) => {
        const f = t * FPS, i = Math.max(0, Math.min(arr.length - 2, Math.floor(f))), k = Math.min(1, Math.max(0, f - i));
        return arr[i] * (1 - k) + arr[i + 1] * k;
      };
      const lineAt = (t) => LINES.find((l) => t >= l.start - 0.4 && t < l.end + 0.4);

      // ---- hands: poses, places and a gesture timeline cut to the words ----
      // pose: four fingers [angle, extension] (index..pinky, + leans toward the thumb), thumb [angle, ext, base x, base y, width]
      const POSE = {
        open:  { f: [[15, 1], [4, 1], [-7, 1], [-19, 1]], th: [54, 1, 60, -70, 1] },
        flat:  { f: [[5, 1], [1, 1], [-3, 0.97], [-8, 0.92]], th: [26, 0.95, 60, -70, 1] },
        point: { f: [[3, 1.06], [0, 0.3], [-2, 0.3], [-4, 0.3]], th: [-14, 0.55, 46, -96, 1] },
        thumb: { f: [[2, 0.12], [0, 0.12], [-2, 0.12], [-4, 0.12]], th: [6, 1.1, 62, -124, 1.42] },
      };
      // place: wrist x, wrist y, forearm angle, hand angle (viewBox units; the left hand is mirrored)
      const PLACE = {
        up: [330, 1390, 16, 0], mid: [320, 1475, 20, 4], rest: [290, 1900, 26, 0],
        wide: [236, 1420, 6, -14], shrug: [252, 1436, -16, -40], thumbs: [292, 1405, 14, -12], both: [282, 1398, 12, -7], bothmid: [288, 1478, 16, -4],
      };
      // [time, right hand [place, pose], left hand [place, pose]]: each state is reached at its time
      const KEYS_REF = [
        [0.0, ["up", "open"], ["rest", "flat"]],          // "I speak FIVE languages": one hand, five fingers
        [1.55, ["up", "open"], ["rest", "flat"]],
        [1.95, ["both", "open"], ["both", "open"]],           // "TEN seconds ago": both hands, ten fingers
        [3.3, ["both", "open"], ["both", "open"]],
        [3.62, ["rest", "flat"], ["rest", "flat"]],
        [3.85, ["up", "open"], ["rest", "flat"]],         // "Hola, amigos": wave
        [4.7, ["up", "flat"], ["rest", "flat"]],
        [5.2, ["mid", "flat"], ["rest", "flat"]],
        [5.85, ["up", "point"], ["rest", "flat"]],        // "sin estudiar nada": finger wag (left of frame)
        [6.95, ["up", "point"], ["rest", "flat"]],
        [7.1, ["up", "open"], ["rest", "flat"]],          // hand stays up, ready to wave
        [7.5, ["up", "open"], ["rest", "flat"]],          // "konnichiwa": wave (left of frame)
        [8.3, ["up", "open"], ["rest", "flat"]],
        [8.55, ["up", "point"], ["rest", "flat"]],        // "ima wa": one finger up
        [9.2, ["up", "point"], ["rest", "flat"]],
        [9.45, ["bothmid", "flat"], ["bothmid", "flat"]],         // talking with both hands
        [10.35, ["bothmid", "flat"], ["bothmid", "flat"]],
        [10.7, ["rest", "flat"], ["rest", "flat"]],
        [10.98, ["rest", "flat"], ["up", "open"]],        // "Bonjour": wave
        [11.6, ["rest", "flat"], ["rest", "flat"]],
        [12.0, ["up", "flat"], ["rest", "flat"]],
        [12.85, ["up", "flat"], ["rest", "flat"]],
        [13.2, ["shrug", "open"], ["shrug", "open"]],     // "Evidemment": shrug
        [13.88, ["shrug", "open"], ["shrug", "open"]],
        [14.25, ["wide", "open"], ["wide", "open"]],      // "da jia hao": hello everyone, arms open
        [14.85, ["wide", "open"], ["wide", "open"]],
        [15.15, ["up", "point"], ["rest", "flat"]],
        [16.1, ["up", "point"], ["rest", "flat"]],
        [16.45, ["rest", "flat"], ["rest", "flat"]],
        [16.75, ["up", "point"], ["rest", "flat"]],       // "JENSEN Huang": finger up
        [17.62, ["up", "point"], ["rest", "flat"]],
        [18.15, ["thumbs", "thumb"], ["thumbs", "thumb"]], // "fine shyt": two thumbs up to the end
        [99, ["thumbs", "thumb"], ["thumbs", "thumb"]],
      ];
      const KEYS = KEYS_REF.map(([t, r, l]) => [rt(t), r, l]);
      // [hand, start, end, degrees, Hz]: waves and wags on top of the hand angle
      const WAVES = [["R", 3.85, 4.7, 17, 3.2], ["R", 5.95, 6.9, 13, 3.6], ["R", 7.28, 8.3, 13, 2.8], ["L", 11.0, 11.55, 12, 3.0], ["R", 16.8, 17.45, 9, 3.0]]
        .map(([h, a, b, d, f]) => [h, rt(a), rt(b), d, f]);
      const SHRUG = [13.12, 13.34, 13.86, 14.12].map(rt); // shoulders up and down
      const lerp = (a, b, u) => a + (b - a) * u;
      const ease = (u) => u * u * (3 - 2 * u);
      function handState(t, side) {
        let i = 0;
        while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
        const [t0, r0, l0] = KEYS[i], [t1, r1, l1] = KEYS[i + 1];
        const a = side === "R" ? r0 : l0, b = side === "R" ? r1 : l1;
        const u = ease(Math.min(1, Math.max(0, (t - t0) / Math.max(1e-3, t1 - t0))));
        const pa = PLACE[a[0]], pb = PLACE[b[0]], qa = POSE[a[1]], qb = POSE[b[1]];
        return {
          place: pa.map((v, k) => lerp(v, pb[k], u)),
          f: qa.f.map((fv, k) => [lerp(fv[0], qb.f[k][0], u), lerp(fv[1], qb.f[k][1], u)]),
          th: qa.th.map((v, k) => lerp(v, qb.th[k], u)),
        };
      }
      const FBASE = [[46, -172], [15, -176], [-17, -173], [-47, -162]];
      function renderHand(t, side, e) {
        const s = handState(t, side);
        let [x, y, arm, rot] = s.place;
        const ph = side === "R" ? 0 : 1.7;
        const up = Math.min(1, Math.max(0, (1700 - y) / 280));
        // never still: a slow drift, plus beats that follow the voice while the hand is up
        x += 5 * Math.sin((2 * Math.PI * t) / 2.7 + ph);
        y += 6 * Math.sin((2 * Math.PI * t) / 3.3 + ph) - 18 * e * up * Math.abs(Math.sin(Math.PI * t * 2.1 + ph));
        rot += 3.5 * e * up * Math.sin((2 * Math.PI * t) / 0.9 + ph);
        for (const [h, a, b, deg, hz] of WAVES) {
          if (h === side && t > a && t < b) rot += deg * Math.sin((Math.PI * (t - a)) / (b - a)) * Math.sin(2 * Math.PI * hz * (t - a));
        }
        y -= shrugAt(t) * 0.9;
        const id = `talk-hand${side}`;
        const mx = side === "R" ? x : 1000 - x;
        set(id, "transform", `translate(${mx.toFixed(1)} ${y.toFixed(1)}) scale(${side === "R" ? 1.1 : -1.1} 1.1) rotate(${arm.toFixed(2)})`);
        set(`${id}-hand`, "transform", `rotate(${rot.toFixed(2)})`);
        s.f.forEach(([ang, ext], k) => {
          set(`${id}-f${k}`, "transform", `translate(${FBASE[k][0]} ${FBASE[k][1]}) rotate(${ang.toFixed(2)}) scale(1 ${ext.toFixed(3)})`);
          // a curled finger folds down over the palm
          set(`${id}-c${k}`, "opacity", Math.min(1, Math.max(0, (0.72 - ext) / 0.3)).toFixed(3));
        });
        const [ta, te, tx, ty, tw] = s.th;
        set(`${id}-th`, "transform", `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${ta.toFixed(2)}) scale(${tw.toFixed(3)} ${te.toFixed(3)})`);
      }
      function shrugAt(t) {
        const [a, b, c, d] = SHRUG;
        if (t <= a || t >= d) return 0;
        if (t < b) return 16 * ease((t - a) / (b - a));
        if (t <= c) return 16;
        return 16 * (1 - ease((t - c) / (d - c)));
      }

      function render(t) {
        const o = sample(M.open, t), w = sample(M.wide, t), r = sample(M.round, t), e = sample(M.energy, t);
        const punch = t >= LINES[5].start - 0.2;

        // mouth: width, opening, pucker; grumpy down-turned corners, smug on the punchline
        const cx = 500, cy = 722;
        const hw = 62 * (1 + 0.22 * w - 0.3 * r);
        const oh = 2 + 52 * o * (1 - 0.18 * w) + 6 * o * r;
        const top = cy - oh * 0.3, bot = cy + oh * 0.7;
        const cyC = cy + (punch && o < 0.08 ? -4 : 4);
        const inner = `M ${cx - hw + 4} ${cyC} C ${cx - hw * 0.6} ${top} ${cx + hw * 0.6} ${top} ${cx + hw - 4} ${cyC} C ${cx + hw * 0.6} ${bot} ${cx - hw * 0.6} ${bot} ${cx - hw + 4} ${cyC} Z`;
        set("talk-inner", "d", inner);
        set("mouthClipPath", "d", inner);
        set("talk-upper", "d", `M ${cx - hw} ${cyC} C ${cx - hw * 0.55} ${top - 7} ${cx - 22} ${top - 14} ${cx - 10} ${top - 13} Q ${cx} ${top - 8} ${cx + 10} ${top - 13} C ${cx + 22} ${top - 14} ${cx + hw * 0.55} ${top - 7} ${cx + hw} ${cyC} C ${cx + hw * 0.6} ${top + 2} ${cx - hw * 0.6} ${top + 2} ${cx - hw} ${cyC} Z`);
        set("talk-lower", "d", `M ${cx - hw} ${cyC} C ${cx - hw * 0.6} ${bot - 2} ${cx + hw * 0.6} ${bot - 2} ${cx + hw} ${cyC} C ${cx + hw * 0.72} ${bot + 19} ${cx - hw * 0.72} ${bot + 19} ${cx - hw} ${cyC} Z`);
        set("talk-seam", "d", `M ${cx - hw + 2} ${cyC} C ${cx - hw * 0.6} ${top + 1} ${cx + hw * 0.6} ${top + 1} ${cx + hw - 2} ${cyC}`);
        set("talk-seam", "opacity", o < 0.12 ? 1 : 0);
        set("talk-teeth", "y", top - 2); set("talk-teeth", "height", Math.min(oh * 0.36, 15));
        set("talk-teeth", "x", cx - hw * 0.72); set("talk-teeth", "width", hw * 1.44);
        set("talk-gap", "y", top - 2); set("talk-gap", "height", Math.min(oh * 0.36, 15));
        set("talk-tongue", "cy", bot - 6); set("talk-tongue", "rx", hw * 0.5); set("talk-tongue", "ry", Math.min(oh * 0.26, 12));

        // eyes: heavy tired lids, blinks, quick glance on each switch
        const blink = blinkAt(t);
        const lidBase = punch ? 0.18 : 0.42;
        const cover = lidBase + (1 - lidBase) * blink;
        const lidY = 539 + cover * 34;
        set("talk-lidL", "height", lidY - 530); set("talk-lidR", "height", lidY - 530);
        set("talk-lidLineL", "d", `M 378 ${lidY + 1} Q 410 ${lidY - 7} 442 ${lidY + 1}`);
        set("talk-lidLineR", "d", `M 558 ${lidY + 1} Q 590 ${lidY - 7} 622 ${lidY + 1}`);
        const L = lineAt(t);
        let gx = 0;
        if (L && t - L.start > -0.35 && t - L.start < 0.15 && L !== LINES[0]) gx = -9 * Math.sin(((t - L.start + 0.35) / 0.5) * Math.PI);
        set("talk-irisL", "transform", `translate(${gx} 0)`); set("talk-irisR", "transform", `translate(${gx} 0)`);

        // brows: lift with speech energy, furrowed by default (grumpy old man), both up on the punchline
        const shrug = shrugAt(t);
        const lift = 7 * e + (punch ? 14 : 0) + shrug * 0.8;
        set("talk-browL", "transform", `translate(0 ${-lift}) rotate(${punch ? -2 : 5} 410 505)`);
        set("talk-browR", "transform", `translate(0 ${-lift * 0.85}) rotate(${punch ? 2 : -5} 590 505)`);

        // head: slow sway + nods driven by speech energy, jaw drop with the mouth
        const ang = 1.8 * Math.sin((2 * Math.PI * t) / 3.1) + 1.4 * e * Math.sin((2 * Math.PI * t) / 0.9 + 1.0);
        const dy = -7 * e * Math.abs(Math.sin(Math.PI * t * 2.1)) + 3 * Math.sin((2 * Math.PI * t) / 2.3) + o * 3 - shrug;
        set("talk-idle", "transform", `rotate(${ang.toFixed(3)} 500 900) translate(0 ${dy.toFixed(2)})`);
        set("talk-body", "transform", `translate(0 ${(-shrug * 0.8).toFixed(2)})`);

        // hands
        renderHand(t, "R", e);
        renderHand(t, "L", e);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => render(clock.t) }, 0);

      // each language switch is a take: anticipation, whip, overshoot, settle (head leads, words follow)
      for (const l of LINES.slice(1)) {
        const s = l.start - 0.34;
        tl.fromTo("#talk-switch", { rotation: 0, scaleX: 1, scaleY: 1, svgOrigin: "500 1000" }, { rotation: 4, scaleY: 0.97, scaleX: 1.02, duration: 0.07, ease: "power2.out" }, s);
        tl.to("#talk-switch", { rotation: -9, scaleY: 1.04, scaleX: 0.98, duration: 0.1, ease: "power3.in" }, s + 0.07);
        tl.to("#talk-switch", { rotation: 3, scaleY: 0.99, scaleX: 1.01, duration: 0.1, ease: "power2.out" }, s + 0.17);
        tl.to("#talk-switch", { rotation: 0, scaleY: 1, scaleX: 1, duration: 0.16, ease: "power2.inOut" }, s + 0.27);
      }

      // the big word punches in, the pill and caption slide up
      const enter = __ENTER__;
      for (const [k, s] of enter) {
        if (k === "en") continue; // frame 0 is the thumbnail: word, pill and caption already on screen
        tl.fromTo(`#talk-bg-${k} span`, { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, s);
        tl.fromTo(`#talk-pill-${k} span`, { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, s + 0.04);
        tl.fromTo(`#talk-cap-${k} div`, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, s + 0.08);
      }
      // camera: subtle zoom that never stops. Each language turns it around (out, in, out...),
      // the punchline leans in furthest. Zoomed from the top of the big word, so the word stays
      // clear of the pill and the chin stays above the captions; never below 1.0, and the pan
      // stays inside the zoom's spare width, so no edge ever shows.
      const ZOOM = [1.045, 1.0, 1.045, 1.0, 1.045, 1.0, 1.065];
      const PAN_X = [10, 0, -10, 0, 10, 0, -10];
      tl.set("#talk-cam", { transformOrigin: "540px 300px" }, 0);
      enter.forEach(([k, s], i) => {
        const e = i + 1 < enter.length ? enter[i + 1][1] : TOTAL;
        tl.fromTo("#talk-cam",
          { scale: ZOOM[i], x: PAN_X[i] },
          { scale: ZOOM[i + 1], x: PAN_X[i + 1], duration: Math.min(e - s, 4.2), ease: "sine.inOut", immediateRender: i === 0 },
          s);
      });

      render(0);
      window.__timelines["talk"] = tl;
    })();
  </script>
</template>
