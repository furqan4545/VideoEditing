const TT = 51.0;                                   // the phone with the post lit and the heart just filled red (tight clock)

}
function likeChip() {   // the count, lifted off the screen as a callout so it reads at thumbnail size (screen space, inside x 100-980)

}
window.__ready = Promise.all([document.fonts.ready, window.FONTS_READY]).then(() => {

  return true;
});
